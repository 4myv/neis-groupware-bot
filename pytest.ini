# pytest.ini: pytest(테스트 도구)의 설정 파일
#
# pythonpath = . : 프로젝트 최상위 폴더에서 모듈을 찾게 한다.
#   이 줄이 없으면 python -m pytest 대신 pytest만 쳤을 때
#   "ModuleNotFoundError: No module named 'app'"이 난다. (docs/step03-devlog.md 문제 1)
# testpaths = tests : 테스트 파일은 tests 폴더에서만 찾는다.

[pytest]
pythonpath = .
testpaths = tests
